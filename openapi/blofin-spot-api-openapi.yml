components:
  schemas:
    PostApiV1SpotTradeOrderRequest:
      type: object
      properties:
        instType:
          type: string
          description: 'Instrument type SPOT : Spot'
        instId:
          type: string
          description: Instrument ID, e.g. BTC-USDT
        side:
          type: string
          description: Order side, buy sell
        orderType:
          type: string
          description: 'Order type market : market order limit : limit order post_only : Post-only order fok : Fill-or-kill order ioc : Immediate-or-cancel order'
        price:
          type: string
          description: Order price. Not applicable to market
        size:
          type: string
          description: Quantity to buy or sell
        targetCurrency:
          type: string
          description: Whether the target currency uses the quote or base currency. base_currency quote_currency Only applicable to Market Orders
        clientOrderId:
          type: string
          description: Client Order ID as assigned by the client A combination of case-sensitive alphanumerics, all numbers, or all letters of up to 32 characters.
        brokerId:
          type: string
          description: Broker ID provided by BloFin. A combination of case-sensitive alphanumerics, all numbers, or all letters of up to 16 characters.
      required:
      - instType
      - instId
      - side
      - orderType
      - price
      - size
    GetApiV1SpotTradeOrdersAlgoHistoryResponse:
      type: object
      properties:
        algoId:
          type: string
          description: Algo order ID
        clientOrderId:
          type: string
          description: Client Order ID as assigned by the client
        instId:
          type: string
          description: Instrument ID
        marginMode:
          type: string
          description: Margin mode
        positionSide:
          type: string
          description: Position side, long short net
        side:
          type: string
          description: Order side
        reduceOnly:
          type: string
          description: Whether the order can only reduce the position size
        orderType:
          type: string
          description: Algo type, trigger
        size:
          type: string
          description: Quantity to buy or sell
        leverage:
          type: string
          description: Leverage
        state:
          type: string
          description: State, live effective canceled order_failed
        actualSize:
          type: string
          description: Actual order quantity
        createTime:
          type: string
          description: Creation time, Unix timestamp format in milliseconds
        triggerPrice:
          type: string
          description: Trigger price
        triggerPriceType:
          type: string
          description: 'Trigger price type last: last price'
        brokerId:
          type: string
          description: Broker ID provided by BloFin
        targetCurrency:
          type: string
          description: Order quantity unit setting for size
        attachAlgoOrders:
          type: array
          description: Attached SL/TP orders info
    PostApiV1SpotTradeCancelAlgoRequest:
