components:
  schemas:
    GetApiV1MarketFundingRateHistoryResponse:
      type: object
      properties:
        instId:
          type: string
        fundingRate:
          type: string
        fundingTime:
          type: string
    GetApiV1MarketBooksResponse:
      type: object
      properties:
        asks:
          type: array
          description: Order book on sell side
        bids:
          type: array
          description: Order book on buy side
        ts:
          type: string
          description: Order book generation time e.g. 1597026383085
    GetApiV1MarketTradesResponse:
      type: object
      properties:
        tradeId:
          type: string
          description: Trade ID
        instId:
          type: string
          description: Instrument ID
        price:
          type: string
          description: Trade price
        size:
          type: string
          description: Trade quantity
        side:
          type: string
          description: Trade side buy sell
        ts:
          type: string
          description: Trade time, Unix timestamp format in milliseconds, e.g. 1597026383085
    GetApiV1MarketMarkPriceResponse:
      type: object
      properties:
        instId:
          type: string
          description: Instrument ID
        indexPrice:
          type: string
          description: Index price
        markPrice:
          type: string
          description: Mark price
        ts:
          type: string
          description: Data return time, Unix timestamp format in milliseconds, e.g. 1597026383085
    GetApiV1MarketIndexCandlesResponse:
      type: object
      properties:
        ts:
          type: string
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        confirm:
          type: string
    GetApiV1MarketInstrumentsHistoryResponse:
      type: object
      properties:
        instId:
          type: string
          description: Instrument ID, e.g. NTRN-USDT
        baseCurrency:
          type: string
          description: Base currency, e.g. NTRN in NTRN-USDT
        quoteCurrency:
          type: string
          description: Quote currency, e.g. USDT in NTRN-USDT
        contractValue:
          type: string
          description: Contract value in base currency, frozen at the value effective at delisting
        maxLeverage:
          type: string
          description: Max Leverage
        minSize:
          type: string
          description: Minimum order size in contracts, frozen at the value effective at delisting
        lotSize:
          type: string
          description: Contract size increment, frozen at the value effective at delisting
        tickSize:
          type: string
          description: Tick size, frozen at the value effective at delisting
        instType:
          type: string
          description: Instrument type
        contractType:
          type: string
          description: 'Contract type linear : linear contract inverse : inverse contract'
        maxLimitSize:
          type: string
          description: The maximum order quantity of the limit order
        maxMarketSize:
          type: string
          description: The maximum order quantity of the market order
        state:
          type: string
          description: Instrument status. Always delisted in this endpoint
        settleCurrency:
          type: string
          description: Settlement and margin currency, e.g. USDT
        assetClass:
          type: string
          description: 'The asset class of the instrument. Supported values include: Crypto , Commodities , Stocks , Indices'
    GetApiV1MarketInstrumentsResponse:
      type: object
      properties:
        instId:
          type: string
          description: Instrument ID, e.g. BTC-USDT
        baseCurrency:
          type: string
          description: Base currency, e.g. BTC in BTC-USDT
        quoteCurrency:
          type: string
          description: Quote currency, e.g. USDT in BTC-USDT
        contractValue:
          type: string
          description: Contract value in base currency (e.g. 0.001 BTC per contract for BTC-USDT)
        listTime:
          type: string
          description: Listing time, Unix timestamp format in milliseconds, e.g. 1597026383085
        expireTime:
          type: string
          description: The trading end time of the instrument, in Unix timestamp milliseconds, e.g. 1767225600000
        offTime:
          type: string
          description: Scheduled instrument offline / delisting time, Unix timestamp in milliseconds, e.g. 1767225600000 . Returns an empty string "" when there is no offline / delisting plan
        maxLeverage:
          type: string
          description: Max Leverage
        minSize:
          type: string
          description: Minimum order size in contracts (e.g. 0.1 contracts = 0.0001 BTC for BTC-USDT)
        lotSize:
          type: string
          description: Contract size increment (e.g. 0.1 for BTC-USDT)
        tickSize:
          type: string
          description: Tick size, e.g. 0.0001
        instType:
          type: string
          description: Instrument type
        contractType:
          type: string
          description: 'Contract type linear : linear contract inverse : inverse contract'
        maxLimitSize:
          type: string
          description: The maximum order quantity of the limit order
        maxMarketSize:
          type: string
          description: The maximum order quantity of the market order
        state:
          type: string
          description: Instrument status live suspend
        settleCurrency:
          type: string
          description: Settlement and margin currency, e.g. BTC
        assetClass:
          type: string
          description: 'The asset class of the instrument. Supported values include: Crypto , Commodities , Stocks , Indices'
    GetApiV1MarketTickersResponse:
      type: object
      properties:
        instId:
          type: string
          description: Instrument ID, e.g. BTC-USDT
        last:
          type: string
          description: Last traded price
        lastSize:
          type: string
          description: Last traded size
        askPrice:
          type: string
          description: Best ask price
        askSize:
          type: string
          description: Best ask size
        bidPrice:
          type: string
          description: Best bid price
        bidSize:
          type: string
          description: Best bid size
        high24h:
          type: string
          description: Highest price in the past 24 hours
        open24h:
          type: string
          description: Open price in the past 24 hours
        low24h:
          type: string
          description: Lowest price in the past 24 hours
        volCurrency24h:
          type: string
          description: 24h trading volume, with a unit of base currency .
        vol24h:
          type: string
          description: 24h trading volume, with a unit of contract .
        ts:
          type: string
          description: Ticker data generation time, Unix timestamp format in milliseconds, e.g. 1597026383085
    GetApiV1MarketCandlesResponse:
      type: object
      properties:
        ts:
          type: string
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        vol:
          type: string
        volCurrency:
          type: string
        volCurrencyQuote:
          type: string
        confirm:
          type: string
    GetApiV1MarketMarkPriceCandlesResponse:
      type: object
      properties:
        ts:
          type: string
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        confirm:
          type: string
    GetApiV1MarketPositionTiersResponse:
      type: object
      properties:
        symbol:
          type: string
        marginMode:
          type: string
        minSize:
          type: string
        maxSize:
          type: string
        maintenanceMarginRate:
          type: string
        maxLeverage:
          type: string
    GetApiV1MarketFundingRateResponse:
      type: object
