      parameters:
      - name: instId
        in: query
        required: true
        schema:
          type: string
        description: Instrument ID, e.g. BTC-USDT
      - name: size
        in: query
        required: false
        schema:
          type: string
        description: Order book depth per side. Maximum 100, e.g. 100 bids + 100 asks Default returns to 1 depth data
      responses:
        '200':
