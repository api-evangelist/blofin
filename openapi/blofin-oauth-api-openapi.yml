      x-evidence:
        kind: documentation
      security:
      - bearer: []
components:
  schemas:
    PostOauthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token used to call BloFin Resource APIs.
        token_type:
          type: string
          description: Token type (Bearer).
    GetOauthResponse:
      type: object
      properties:
        code:
          type: string
          description: Authorization code (valid for 10 minutes, usable only once).
        state:
          type: string
          description: Exact value you passed in the request.
