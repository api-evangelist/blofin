      - Oauth
      summary: Get the authorized user's deposit address for a specified currency and chain.
      x-source: https://docs.blofin.com/broker.html
      responses:
        '201':
          description: Success (status as documented)
      x-evidence:
        kind: documentation
      security:
      - bearer: []
    servers:
    - url: https://oauth.blofin.com
  /oauth/deposit/status:
    get:
      operationId: get_oauth_deposit_status
      tags:
      - Oauth
      summary: Check whether the authorized user has completed their first deposit on BloFin.
      x-source: https://docs.blofin.com/broker.html
      responses:
        '200':
          description: Success (status as documented)
      x-evidence:
        kind: documentation
      security:
      - bearer: []
    servers:
    - url: https://oauth.blofin.com
  /oauth/token:
    post:
      operationId: post_oauth_token
      tags:
      - Oauth
      summary: Exchange an authorization code for tokens, or refresh an expired access_token.
      x-source: https://docs.blofin.com/broker.html
      parameters:
      - name: grant_type
        in: query
        required: true
        schema:
          type: string
        description: Fixed as authorization_code or refresh_token.
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your BloFin client ID.
      - name: client_secret
        in: query
        required: true
        schema:
          type: string
        description: Your BloFin client secret.
      - name: code
        in: query
        required: false
        schema:
          type: string
        description: Authorization code from Get Authorization Code (Mode 1 only).
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
        description: Same as the one used in the authorization request (Mode 1 only).
      - name: refresh_token
        in: query
        required: false
        schema:
          type: string
        description: Valid refresh_token from a previous success response (Mode 2 only).
      responses:
        '201':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOauthTokenResponse'
      x-evidence:
        kind: documentation
      security:
      - bearer: []
    servers:
    - url: https://oauth.blofin.com
  /oauth/userinfo:
    get:
      operationId: get_oauth_userinfo
      tags:
      - Oauth
      summary: Read desensitized basic info of the authorized user (e.g., desensitized UID, account status).
      x-source: https://docs.blofin.com/broker.html
      responses:
        '200':
          description: Success (status as documented)
      x-evidence:
        kind: documentation
      security:
      - bearer: []
    servers:
    - url: https://oauth.blofin.com
