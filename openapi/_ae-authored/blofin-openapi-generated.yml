      tags:
      - Api
      summary: Retrieve funding fee history.
      x-source: https://docs.blofin.com/index.html
      parameters:
      - name: begin
        in: query
        required: true
        schema:
          type: string
        description: Filter with a begin timestamp. Unix timestamp format in milliseconds, e.g. 1597026383085 . The interval
          between begin and end must be within 7 days
      - name: end
        in: query
        required: true
        schema:
          type: string
        description: Filter with an end timestamp. Unix timestamp format in milliseconds, e.g. 1597026383085 . The interval
          between begin and end must be within 7 days
      - name: instId
        in: query
        required: false
        schema:
          type: string
        description: Instrument ID, e.g. BTC-USDT . Returns all instruments if not specified
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Number of results per request. The maximum is 1000 ; The default is 100
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Pagination of data to return records earlier than the requested billId
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Pagination of data to return records newer than the requested billId
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
