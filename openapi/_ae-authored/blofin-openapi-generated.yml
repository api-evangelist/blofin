  /oauth:
    get:
      operationId: get_oauth
      tags:
      - Oauth
      summary: Redirect the user to BloFin's authorization page to obtain an authorization code.
      x-source: https://docs.blofin.com/broker.html
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
        description: 'Fixed value: code (identifies Authorization Code Grant).'
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your unique client ID from BloFin.
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
        description: HTTPS URI filed with BloFin, URL-encoded.
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Space-separated permission scopes (e.g., user:read create:apikey).
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Random string (16–32 characters) for CSRF prevention.
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOauthResponse'
      x-evidence:
        kind: documentation
      security:
      - bearer: []
    servers:
    - url: https://oauth.blofin.com
  /oauth/apikey/create:
    post:
      operationId: post_oauth_apikey_create
      tags:
      - Oauth
      summary: Create a Broker API key on behalf of the authorized user.
      x-source: https://docs.blofin.com/broker.html
      responses:
        '201':
          description: Success (status as documented)
