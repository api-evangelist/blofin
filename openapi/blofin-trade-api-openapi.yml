        schema:
          type: string
        description: Instrument ID, e.g. BTC-USDT
      - name: orderId
        in: query
        required: false
        schema:
          type: string
        description: Order ID Either orderId or clientOrderId is required.
      - name: clientOrderId
        in: query
        required: false
