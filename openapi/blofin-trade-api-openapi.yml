        description: Client-supplied order ID Either orderId or clientOrderId is required.
      - name: requestId
        in: query
        required: false
        schema:
          type: string
        description: Client-supplied idempotency key for safe retries.
      - name: ttl
        in: query
        required: false
        schema:
          type: string
        description: Request validity in milliseconds
      - name: newSize
        in: query
        required: false
        schema:
          type: string
        description: New size. At least one amend-content field ( newSize / newPrice / TP/SL) is required.
      - name: newPrice
        in: query
        required: false
        schema:
          type: string
        description: New price. At least one amend-content field ( newSize / newPrice / TP/SL) is required.
      - name: newTpTriggerPrice
        in: query
        required: false
        schema:
          type: string
        description: New take-profit trigger price. Set to 0 to remove the take-profit.
      - name: newTpTriggerPriceType
        in: query
        required: false
        schema:
          type: string
        description: 'Take-profit trigger price type last : last price index : index price mark : mark price'
      - name: newTpOrderPrice
        in: query
        required: false
        schema:
          type: string
        description: New take-profit order price; -1 for market.
      - name: newSlTriggerPrice
        in: query
        required: false
        schema:
          type: string
        description: New stop-loss trigger price. Set to 0 to remove the stop-loss.
      - name: newSlTriggerPriceType
        in: query
        required: false
        schema:
          type: string
        description: 'Stop-loss trigger price type last : last price index : index price mark : mark price'
      - name: newSlOrderPrice
        in: query
        required: false
        schema:
          type: string
        description: New stop-loss order price; -1 for market.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiV1TradeAmendOrderRequest'
