        description: Order Price If the price is -1 , the order will be executed at the market price.
      - name: reduceOnly
        in: query
        required: false
        schema:
          type: string
        description: 'Whether the order can only reduce the position size. Valid options: true or false. The default value is false.'
      - name: brokerId
        in: query
        required: false
        schema:
          type: string
        description: Broker ID provided by BloFin.
      - name: positionId
        in: query
        required: false
        schema:
          type: string
        description: Position ID. Required in Multi-Position mode.
      - name: triggerPrice
        in: query
        required: false
        schema:
          type: string
        description: Trigger price
      - name: triggerPriceType
        in: query
        required: false
        schema:
          type: string
        description: 'Trigger price type last : last price'
      - name: callbackRatio
