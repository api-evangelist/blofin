        kind: documentation
  /api/v1/asset/bills:
    get:
      operationId: get_api_v1_asset_bills
      tags:
      - Asset
      summary: Query the funds transfer records
      x-source: https://docs.blofin.com/spot.html
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          type: string
        description: Transfer currency, e.g. USDT
      - name: fromAccount
        in: query
        required: false
        schema:
          type: string
        description: The remitting account funding futures copy_trading earn spot inverse_contract unified account use futures
      - name: toAccount
        in: query
        required: false
        schema:
          type: string
        description: The beneficiary account funding futures copy_trading earn spot inverse_contract unified account use futures
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Pagination of data to return records newer than the requested ts, Unix timestamp format in milliseconds, e.g. 1656633600000
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Pagination of data to return records earlier than the requested ts, Unix timestamp format in milliseconds, e.g. 1654041600000
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Number of results per request. The maximum is 100; The default is 100
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiV1AssetBillsResponse'
