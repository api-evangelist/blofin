      - Asset
      summary: Transfer funds between your accounts
      x-source: https://docs.blofin.com/spot.html
      parameters:
      - name: currency
        in: query
        required: true
        schema:
          type: string
        description: Transfer currency, e.g. USDT
      - name: amount
        in: query
        required: true
