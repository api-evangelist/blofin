      - Asset
      summary: Retrieve the deposit records according to the currency, status, and time range…
      x-source: https://docs.blofin.com/spot.html
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          type: string
        description: Currency, e.g. USDT
      - name: depositId
        in: query
        required: false
        schema:
          type: string
        description: Deposit ID
      - name: txId
        in: query
        required: false
        schema:
          type: string
        description: Hash record of the deposit
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: 'Status of deposit 0 : pending 1 : done 2 : failed 3 : kyt'
      - name: before
        in: query
        required: false
