      - name: toAccount
        in: query
        required: true
        schema:
          type: string
        description: The beneficiary account funding futures copy_trading earn spot inverse_contract unified account use futures
      - name: clientId
        in: query
        required: false
        schema:
          type: string
        description: Client-supplied ID A combination of case-sensitive alphanumerics, all numbers, or all letters of up to 32 characters.
      - name: subAccount
        in: query
        required: false
        schema:
          type: string
        description: Sub Account Uid
      - name: mainToSubAccount
        in: query
        required: false
        schema:
          type: string
        description: 'true : master->sub false : sub->master Required for inter-account transfer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiV1AssetTransferRequest'
      responses:
        '201':
          description: Success (status as documented)
