  /api/v1/affiliate/invitees:
    get:
      operationId: get_api_v1_affiliate_invitees
      tags:
      - Affiliate
      summary: Retrieve the direct invitees info of affiliates
      x-source: https://docs.blofin.com/index.html
      parameters:
      - name: uid
        in: query
        required: false
        schema:
          type: string
        description: Invitee's UID
      - name: needEquity
        in: query
        required: false
        schema:
          type: string
        description: Whether to return the user's equity in the results.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Pagination of data to return records earlier than the requested id
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Pagination of data to return records newer than the requested id
      - name: begin
        in: query
        required: false
        schema:
          type: string
        description: Filter with a begin timestamp. Unix timestamp format in milliseconds, e.g. 1597026383085
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: Filter with an end timestamp. Unix timestamp format in milliseconds, e.g. 1597026383085
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Number of results per request. When needEquity is false , the maximum limit is 200 . When needEquity is true , the maximum limit is 30 . The default value is 10
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiV1AffiliateInviteesResponse'
      x-evidence:
        kind: documentation
  /api/v1/affiliate/invitees/daily/info:
    get:
      operationId: get_api_v1_affiliate_invitees_daily_info
      tags:
      - Affiliate
      summary: Retrieve the daily commission data of direct invitees
      x-source: https://docs.blofin.com/index.html
      parameters:
      - name: uid
        in: query
        required: true
        schema:
          type: string
        description: Invitee's UID， Required if only begin / end paging is used, otherwise the data will be inaccurate if only begin / end is used.
      - name: begin
        in: query
        required: false
        schema:
          type: string
        description: Filter with a begin timestamp. Unix timestamp format in milliseconds, e.g. 1597026383085
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: Filter with an end timestamp. Unix timestamp format in milliseconds, e.g. 1597026383085
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Number of results per request. The maximum is 100 ; The default is 10
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiV1AffiliateInviteesDailyInfoResponse'
      x-evidence:
        kind: documentation
