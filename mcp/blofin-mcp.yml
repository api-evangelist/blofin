name: BloFin MCP Server
generated: '2026-10-13'
method: searched
source: https://github.com/blofin/blofin-mcp
status: official
description: Official MCP server for the BloFin exchange API (market data, account, trading, asset management), documented
  at https://docs.blofin.com/index.html#mcp-server.
deployment:
  mode: local-stdio
  install: npx -y blofin-mcp
  package: https://www.npmjs.com/package/blofin-mcp
  auth: api-key
  verified: searched
  note: Also distributed as a Claude Desktop extension (blofin-mcp.mcpb on GitHub Releases). Credentials via BLOFIN_API_KEY,
    BLOFIN_API_SECRET, BLOFIN_PASSPHRASE; BLOFIN_BASE_URL defaults to demo trading. A probe of https://api.blofin.com/api/mcp
    returned 403 for request and control alike (opaque) and is not recorded as a remote endpoint.
