aid: blofin

name: BloFin

description: 'BloFin is a cryptocurrency exchange offering spot, perpetual futures and copy trading. Its public Open API (base https://openapi.blofin.com,
  demo https://demo-trading-openapi.blofin.com) exposes REST endpoints for public market data, account, trading, asset management, affiliate and
  copy trading, plus public and private WebSocket channels, authenticated with ACCESS-KEY / ACCESS-SIGN HMAC-signed headers; a separate OAuth
  broker API runs at oauth.blofin.com. BloFin also publishes an official MCP server (blofin-mcp), an agent-first CLI (blofin-cli), a Python SDK
  and an agent skills hub on GitHub. Surfaced via the API Evangelist harvest backlog (source: market-gap:crypto-exchanges).'

